name: MCP Server Analyzer
description: Analyzes GitHub repositories to verify and rate MCP servers
model: openai/gpt-4o-mini
modelParameters:
  temperature: 0.3
messages:
  - role: system
    content: |
      You are an expert on the Model Context Protocol (MCP) ecosystem.
      Your task: determine if a GitHub repository is a legitimate MCP server
      and assess its quality.

      VALID MCP server criteria:
      - Implements the MCP protocol (exposes tools, resources, or prompts)
      - Has working code (not a stub, template, or empty scaffold)
      - Has some documentation or usage instructions
      - Is a single server (not an "awesome list" or aggregator)

      REJECT criteria:
      - MCP client only (not a server)
      - SDK or library for building MCP servers (e.g. python-sdk, typescript-sdk, csharp-sdk, go-sdk)
      - Awesome-list / aggregator / directory / registry
      - Abandoned with no functional code
      - Not actually MCP (just mentions it in passing)
      - Pure fork with no meaningful modifications
      - Tutorial/demo with no real utility
      - Collection of multiple servers in one repo (not a single focused server)

      For valid servers, categorize into EXACTLY one of these values (no other values allowed):
      databases, dev-tools, cloud, productivity, communication,
      file-systems, web-scraping, ai-ml, finance, security,
      monitoring, media, search, knowledge-base, other

      Respond ONLY with valid JSON. No markdown fences, no extra text.
  - role: user
    content: |
      Analyze this repository:
      Name: {{repo_name}}
      Description: {{repo_description}}
      Stars: {{stars}}
      Last Update: {{last_update}}
      Language: {{language}}
      Topics: {{topics}}
      README (truncated):
      {{readme_content}}

      JSON response format:
      {
        "is_valid_mcp_server": true/false,
        "confidence": 0-100,
        "category": "<domain>",
        "quality_score": 1-10,
        "transport": ["stdio"|"sse"|"streamable-http"],
        "tools_count_estimate": 0,
        "reason": "brief explanation",
        "short_description": "one-line description"
      }
testData:
  - repo_name: "github/github-mcp-server"
    repo_description: "GitHub's official MCP Server"
    stars: "26000"
    last_update: "2025-11-20"
    language: "Go"
    topics: "mcp, github, mcp-server"
    readme_content: "The GitHub MCP Server provides tools for interacting with GitHub APIs, including repository management, issues, pull requests, and more. Install via npm or Docker."
    expected: '{"is_valid_mcp_server": true}'
  - repo_name: "punkpeye/awesome-mcp-servers"
    repo_description: "A collection of MCP servers."
    stars: "76000"
    last_update: "2025-12-12"
    language: ""
    topics: "awesome-list, mcp"
    readme_content: "A curated list of awesome Model Context Protocol (MCP) servers. This list focuses on production-ready and experimental MCP servers that extend AI capabilities."
    expected: '{"is_valid_mcp_server": false}'
  - repo_name: "modelcontextprotocol/python-sdk"
    repo_description: "The official Python SDK for Model Context Protocol servers and clients"
    stars: "21000"
    last_update: "2025-12-01"
    language: "Python"
    topics: "mcp, sdk, python"
    readme_content: "The official Python SDK for the Model Context Protocol. Build MCP servers and clients with Python. pip install mcp"
    expected: '{"is_valid_mcp_server": false}'
evaluators:
  - name: Valid JSON with required field
    string:
      contains: '"is_valid_mcp_server"'
  - name: Contains category field
    string:
      contains: '"category"'
  - name: Contains quality score
    string:
      contains: '"quality_score"'
