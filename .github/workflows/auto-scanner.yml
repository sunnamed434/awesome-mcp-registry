name: Auto Scanner

on:
  schedule:
    - cron: '0 2 * * 0'    # Every Sunday at 2:00 UTC
  workflow_dispatch:        # Manual trigger (with optional budget overrides for catch-up runs)
    inputs:
      max_new_analyses:
        description: 'Override MAX_NEW_ANALYSES for this run'
        required: false
        default: ''
      max_re_evaluations:
        description: 'Override MAX_RE_EVALUATIONS for this run'
        required: false
        default: ''
      max_nominations:
        description: 'Override MAX_NOMINATIONS for this run'
        required: false
        default: ''

permissions:
  contents: write          # push the update branch
  models: read
  issues: write            # comment on / close processed nomination issues
  pull-requests: write     # open + auto-merge the update PR (Safe Outputs)

# A manual catch-up dispatch must not overlap the Sunday run: both would PR the
# same generated files and the loser's auto-merge fails, orphaning the PR.
concurrency:
  group: auto-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
          MAX_NEW_ANALYSES: ${{ github.event.inputs.max_new_analyses || '' }}
          MAX_RE_EVALUATIONS: ${{ github.event.inputs.max_re_evaluations || '' }}
          MAX_NOMINATIONS: ${{ github.event.inputs.max_nominations || '' }}
        run: python scripts/scan_repos.py
        working-directory: ${{ github.workspace }}

      # Diff the freshly generated cache against the committed one BEFORE the
      # commit step: the notes feed the PR body and the weekly Release below.
      # Links inside the notes are pinned to the release tag (not master), so
      # an old release keeps pointing at that week's snapshot of the files.
      - name: Build weekly diff notes
        id: notes
        run: |
          TAG="registry-$(date -u +%Y-%m-%d)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git show HEAD:data/known_servers.json > /tmp/known_old.json 2>/dev/null \
            || echo '{"servers":[]}' > /tmp/known_old.json
          python scripts/release_notes.py /tmp/known_old.json data/known_servers.json "$TAG" \
            | tee /tmp/release_notes.md

      # Safe Outputs: the bot never force-commits to master. It pushes a branch and
      # opens a PR that auto-merges, so every automated change is an auditable, revertable diff.
      - name: Commit changes to a branch
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          GENERATED="data/known_servers.json data/star_history.jsonl README.md SCORES.md badges"
          git add -N $GENERATED  # so brand-new generated files show up in git diff
          if git diff --quiet -- $GENERATED; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to publish."
            exit 0
          fi
          BRANCH="auto/registry-update-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add $GENERATED
          # "[automated]" = the content is bot-generated (true for cron and
          # dispatch alike); manual dispatches are additionally marked so the
          # history shows which runs a human kicked off.
          SUFFIX=""
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && SUFFIX=" (manual dispatch)"
          git commit -m "Update MCP server registry [automated]$SUFFIX"
          git push origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open and auto-merge update PR
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const branch = '${{ steps.commit.outputs.branch }}';
            const common = { owner: context.repo.owner, repo: context.repo.repo };
            let notes = '';
            try {
              notes = require('fs').readFileSync('/tmp/release_notes.md', 'utf8').trim();
            } catch (e) { core.info(`no release notes: ${e.message}`); }
            const manual = context.eventName === 'workflow_dispatch';
            const pr = await github.rest.pulls.create({
              ...common,
              head: branch,
              base: 'master',
              title: 'Update MCP server registry [automated]' + (manual ? ' (manual dispatch)' : ''),
              body: [
                manual
                  ? `Update from the Continuous-AI scanner (manual dispatch by @${context.actor}).`
                  : 'Automated weekly update from the Continuous-AI scanner.',
                '',
                'Only the generated files (`data/known_servers.json`, `data/star_history.jsonl`,',
                '`README.md`, `SCORES.md`, `badges/`) change.',
                'Opened and auto-merged as a PR so the diff is reviewable and revertable.',
                '',
                notes,
              ].join('\n'),
            });
            await github.rest.pulls.merge({
              ...common, pull_number: pr.data.number, merge_method: 'squash' });
            try {
              await github.rest.git.deleteRef({ ...common, ref: `heads/${branch}` });
            } catch (e) {
              core.info(`branch cleanup: ${e.message}`);
            }
            core.info(`PR #${pr.data.number} opened and merged.`);

      # Watchers get a notification for every release, and releases.atom is a
      # free RSS feed of the weekly changelog.
      - name: Publish weekly release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.notes.outputs.tag }}"
          gh release create "$TAG" --target master \
            --title "Registry update ${TAG#registry-}" \
            --notes-file /tmp/release_notes.md \
            || echo "Release $TAG already exists; skipping."
