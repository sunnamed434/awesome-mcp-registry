name: Set up labels

# Creates the nomination status labels with colors + descriptions so they look
# intentional (instead of auto-created grey). Idempotent: updates them if they
# already exist. Run manually once from the Actions tab; safe to re-run anytime.

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const labels = [
              { name: 'server-nomination',      color: '1d76db', description: 'A community nomination of an MCP server' },
              { name: 'status: queued',         color: 'fbca04', description: 'Waiting for the next weekly AI scan' },
              { name: 'status: accepted',       color: '0e8a16', description: 'Evaluated and listed in the registry (trust 50+/100)' },
              { name: 'status: below-threshold', color: 'd93f0b', description: 'Valid MCP server but scored below the 50/100 cutoff' },
              { name: 'status: declined',       color: 'b60205', description: 'Not a qualifying MCP server, or no public repo' },
              { name: 'status: excluded',       color: '5319e7', description: 'On the exclusion list (policy removal or maintainer opt-out) — not evaluated' },
              { name: 'status: withdrawn',      color: 'cccccc', description: 'Closed by the submitter before evaluation' },
              { name: 'workflow-failure',       color: 'd73a4a', description: 'Auto-opened by the failure tracker when a CI workflow fails; auto-closed on recovery' },
              { name: 'exclusion-appeal',       color: '0052cc', description: 'Appeal of an entry on data/excluded-repos.txt' },
              { name: 'maintainer-opt-out',     color: '0052cc', description: 'Maintainer requests removal of their repo from the registry' },
              { name: 'verified',               color: '0e8a16', description: 'Opt-out ownership verified automatically by the intake bot' },
            ];
            const common = { owner: context.repo.owner, repo: context.repo.repo };
            for (const l of labels) {
              try {
                await github.rest.issues.createLabel({ ...common, ...l });
                core.info(`Created ${l.name}`);
              } catch (e) {
                if (e.status === 422) {
                  await github.rest.issues.updateLabel({ ...common, ...l });  // already exists -> update
                  core.info(`Updated ${l.name}`);
                } else {
                  core.warning(`${l.name}: ${e.message}`);
                }
              }
            }
