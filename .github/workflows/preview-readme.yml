name: Preview README

# This workflow is for testing/debugging README generation only.
# It generates a preview without running the full scan or creating commits.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Generate README + SCORES preview
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'scripts')
          from utils import load_cache, generate_readme, generate_scores_md, load_star_history

          cache = load_cache('data/known_servers.json')
          valid = [s for s in cache['servers'] if s.get('analysis', {}).get('is_valid_mcp_server', False)]
          history = load_star_history('data/star_history.jsonl')
          generate_readme(valid, 'README-preview.md', history=history)
          generate_scores_md(valid, 'SCORES-preview.md', history=history)
          print(f'Generated preview with {len(valid)} valid servers')
          "

      - name: Display README preview in job summary
        run: |
          echo "# README Preview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat README-preview.md >> $GITHUB_STEP_SUMMARY

      - name: Upload previews
        uses: actions/upload-artifact@v7
        with:
          name: readme-preview
          path: |
            README-preview.md
            SCORES-preview.md
