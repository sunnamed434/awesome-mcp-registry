name: Validate nomination

# Two responsibilities:
#  1. validate  — instant feedback on new nomination issues (sanity-check the repo URL).
#  2. adopt-legacy — a scheduled/manual sweep that labels older "add an MCP server"
#     issues (created before the nomination form existed) so the weekly scanner can
#     process them. Labeling is reversible; the irreversible evaluate+close in the
#     scanner only acts on the `server-nomination` label.
#
# The real AI evaluation runs in the weekly Auto Scanner, not here.

on:
  issues:
    types: [opened, edited]
  schedule:
    - cron: '45 3 * * *'   # daily legacy sweep
  workflow_dispatch:

permissions:
  issues: write

jobs:
  validate:
    if: >
      github.event_name == 'issues' &&
      contains(join(github.event.issue.labels.*.name, ','), 'server-nomination')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- nomination-validation -->';
            const issue = context.payload.issue;
            const body = issue.body || '';
            const m = body.match(/github\.com\/([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)/i);

            let msg;
            if (!m) {
              msg = [
                "👋 Thanks for the nomination! I couldn't find a `https://github.com/owner/repo`",
                "URL in it. This registry only evaluates **open-source MCP servers with a public",
                "GitHub repository** — please edit the issue to include one.",
              ].join(' ');
            } else {
              const repoOwner = m[1];
              const repoName = m[2].replace(/\.git$/i, '').replace(/[#?].*$/, '');
              try {
                const r = await github.rest.repos.get({ owner: repoOwner, repo: repoName });
                if (r.data.private) throw new Error('private');
                msg = [
                  `👋 Thanks! \`${repoOwner}/${repoName}\` is **queued**. The AI evaluates it on the`,
                  "next weekly scan (Sundays), posts the verdict here, and closes this issue.",
                  "If it scores 5+/10 it'll appear in the README automatically. No action needed.",
                ].join(' ');
              } catch (e) {
                msg = [
                  `👋 Thanks for the nomination, but \`${repoOwner}/${repoName}\` doesn't look like a`,
                  "reachable **public** GitHub repo. Only public repos can be evaluated —",
                  "please double-check the URL and edit the issue.",
                ].join(' ');
              }
            }

            const common = { owner: context.repo.owner, repo: context.repo.repo };
            const author = (issue.user && issue.user.login) || '';
            const bodyOut = author ? `${MARKER}\n@${author} ${msg}` : `${MARKER}\n${msg}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...common, issue_number: issue.number, per_page: 100 });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && (c.body || '').includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ ...common, comment_id: existing.id, body: bodyOut });
            } else {
              await github.rest.issues.createComment({ ...common, issue_number: issue.number, body: bodyOut });
            }

  adopt-legacy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const common = { owner: context.repo.owner, repo: context.repo.repo };
            const MARKER = '<!-- nomination-adopted -->';
            const contributing =
              `https://github.com/${common.owner}/${common.repo}/blob/master/CONTRIBUTING.md`;
            // Conservative heuristic: an open issue whose title reads like
            // "add/nominate ... mcp/server" is treated as a legacy nomination.
            const looksLikeNomination = t => /\b(add|nominat)/i.test(t) && /\b(mcp|server)\b/i.test(t);

            const explainBody = (author) => {
              const msg = [
                "Thanks! I've tagged this as a **server nomination** and queued it. 👋",
                "",
                "**What that means:** this registry curates itself with AI — there's no manual PR",
                "step. On the next weekly scan, the AI reviews your nomination, posts the result here,",
                "and closes this issue. If it points to a public open-source GitHub repo that scores",
                "5+/10, it's added to the README automatically. Nothing else needed from you.",
                "",
                `_How it works: [CONTRIBUTING.md](${contributing})._`,
              ].join('\n');
              return author ? `${MARKER}\n@${author} ${msg}` : `${MARKER}\n${msg}`;
            };

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...common, state: 'open', per_page: 100 });
            let labeled = 0, explained = 0;
            for (const issue of issues) {
              if (issue.pull_request) continue;  // skip PRs
              const labels = (issue.labels || []).map(l => (l.name || l));
              const isNomination =
                labels.includes('server-nomination') || looksLikeNomination(issue.title || '');
              if (!isNomination) continue;

              // 1) Ensure it's labeled.
              if (!labels.includes('server-nomination')) {
                await github.rest.issues.addLabels({
                  ...common, issue_number: issue.number, labels: ['server-nomination'] });
                core.info(`Labeled #${issue.number}: ${issue.title}`);
                labeled++;
              }

              // 2) Ensure it has a one-time explanation (also covers issues labeled in an
              //    earlier run that never got an explanation). Idempotent via the marker.
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...common, issue_number: issue.number, per_page: 100 });
              const explainedAlready = comments.some(c =>
                c.user.type === 'Bot' && (c.body || '').includes(MARKER));
              if (!explainedAlready) {
                const author = (issue.user && issue.user.login) || '';
                await github.rest.issues.createComment({
                  ...common, issue_number: issue.number, body: explainBody(author) });
                explained++;
              }
            }
            core.info(`Labeled ${labeled}, explained ${explained} nomination(s)`);
