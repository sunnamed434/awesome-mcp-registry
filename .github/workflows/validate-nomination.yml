name: Validate nomination

# Two responsibilities:
#  1. validate  — instant feedback on new nomination issues: sanity-check the repo URL
#     AND short-circuit duplicates (already-listed servers are finalized immediately
#     instead of waiting for the Sunday scan).
#  2. adopt-legacy — a scheduled/manual sweep that labels older "add an MCP server"
#     issues (created before the nomination form existed) so the weekly scanner can
#     process them.
#
# The full AI evaluation still runs in the weekly Auto Scanner, not here.

on:
  issues:
    types: [opened, edited, closed, reopened]
  schedule:
    - cron: '45 3 * * *'   # daily legacy sweep
  workflow_dispatch:

permissions:
  issues: write

jobs:
  validate:
    if: >
      github.event_name == 'issues' &&
      (github.event.action == 'opened' || github.event.action == 'edited' || github.event.action == 'reopened') &&
      contains(join(github.event.issue.labels.*.name, ','), 'server-nomination')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- nomination-validation -->';
            const issue = context.payload.issue;
            const body = issue.body || '';
            const common = { owner: context.repo.owner, repo: context.repo.repo };
            const m = body.match(/github\.com\/([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)/i);

            // Look up a repo in the published registry (public raw file, case-insensitive).
            async function findInRegistry(fullName) {
              try {
                const url = `https://raw.githubusercontent.com/${common.owner}/${common.repo}/master/data/known_servers.json`;
                const res = await fetch(url);
                if (!res.ok) return null;
                const json = await res.json();
                const want = fullName.toLowerCase();
                return (json.servers || []).find(s => (s.full_name || '').toLowerCase() === want) || null;
              } catch (e) {
                core.info(`Could not read registry cache: ${e.message}`);
                return null;
              }
            }

            // Notice + final status label for an already-known server.
            function knownNotice(srv) {
              const a = srv.analysis || {};
              const fn = srv.full_name;
              const url = srv.url || `https://github.com/${fn}`;
              const score = a.quality_score || 0;
              if (a.is_valid_mcp_server && score >= 5) {
                return { label: 'status: accepted',
                  text: `✅ **Already listed** — [\`${fn}\`](${url}) is already in the registry (scored ${score}/10). Thanks — nothing to do here!` };
              }
              if (a.is_valid_mcp_server) {
                return { label: 'status: below-threshold',
                  text: `**Already evaluated** — [\`${fn}\`](${url}) is a valid MCP server but scored **${score}/10**, below the 5/10 cutoff, so it isn't listed yet. It's re-checked automatically; if it improves it can still make the list.` };
              }
              return { label: 'status: declined',
                text: `**Already evaluated** — the AI previously didn't classify [\`${fn}\`](${url}) as a qualifying, single-purpose MCP server, so it isn't listed.` };
            }

            let msg, resolveLabel = null, queueable = false;  // resolveLabel => dup; queueable => reachable new repo
            if (!m) {
              msg = "👋 Thanks for the nomination! I couldn't find a `https://github.com/owner/repo` URL in it. This registry only evaluates **open-source MCP servers with a public GitHub repository** — please edit the issue to include one.";
            } else {
              const repoOwner = m[1];
              const repoName = m[2].replace(/\.git$/i, '').replace(/[#?].*$/, '');
              try {
                const r = await github.rest.repos.get({ owner: repoOwner, repo: repoName });
                if (r.data.private) throw new Error('private');
                const known = await findInRegistry(`${repoOwner}/${repoName}`);
                if (known) {
                  const n = knownNotice(known);
                  msg = n.text;
                  resolveLabel = n.label;
                } else {
                  msg = `👋 Thanks! \`${repoOwner}/${repoName}\` is **queued**. The AI evaluates it on the next weekly scan (Sundays), posts the verdict here, and closes this issue. If it scores 5+/10 it'll appear in the README automatically. No action needed.`;
                  queueable = true;
                }
              } catch (e) {
                msg = `👋 Thanks for the nomination, but \`${repoOwner}/${repoName}\` doesn't look like a reachable **public** GitHub repo. Only public repos can be evaluated — please double-check the URL and edit the issue.`;
              }
            }

            // Post or update our single marked comment (@-mentioning the author).
            const author = (issue.user && issue.user.login) || '';
            const bodyOut = author ? `${MARKER}\n@${author} ${msg}` : `${MARKER}\n${msg}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...common, issue_number: issue.number, per_page: 100 });
            const prior = comments.find(c => c.user.type === 'Bot' && (c.body || '').includes(MARKER));
            if (prior) {
              await github.rest.issues.updateComment({ ...common, comment_id: prior.id, body: bodyOut });
            } else {
              await github.rest.issues.createComment({ ...common, issue_number: issue.number, body: bodyOut });
            }

            if (resolveLabel) {
              // Known duplicate — finalize immediately instead of waiting for the scan.
              await github.rest.issues.addLabels({ ...common, issue_number: issue.number, labels: [resolveLabel] });
              try {
                await github.rest.issues.removeLabel({ ...common, issue_number: issue.number, name: 'status: queued' });
              } catch (e) { /* wasn't set */ }
              if (issue.state === 'open') {
                await github.rest.issues.update({ ...common, issue_number: issue.number, state: 'closed' });
              }
            } else if (queueable && issue.state === 'open') {
              // Reachable, not-yet-known repo — queue it; clear any prior terminal status.
              for (const stale of ['status: withdrawn', 'status: declined']) {
                try {
                  await github.rest.issues.removeLabel({ ...common, issue_number: issue.number, name: stale });
                } catch (e) { /* wasn't set */ }
              }
              await github.rest.issues.addLabels({ ...common, issue_number: issue.number, labels: ['status: queued'] });
            }
            // else: no usable repo URL — leave labels as-is; the comment guides the user
            //       and the weekly scan will resolve it regardless.

  withdraw:
    # A human closed a still-queued nomination -> it's withdrawn, not to be scanned.
    # (Bot closes use GITHUB_TOKEN and don't trigger this, so post-evaluation closes
    # are unaffected.)
    if: >
      github.event_name == 'issues' &&
      github.event.action == 'closed' &&
      contains(join(github.event.issue.labels.*.name, ','), 'server-nomination')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const common = { owner: context.repo.owner, repo: context.repo.repo };
            const labels = (issue.labels || []).map(l => (l.name || l));
            if (!labels.includes('status: queued')) {
              core.info('Closed nomination was not queued (already evaluated or withdrawn); nothing to do.');
              return;
            }
            // The scanner already ignores closed issues; this keeps labels honest + notes why.
            try {
              await github.rest.issues.removeLabel({ ...common, issue_number: issue.number, name: 'status: queued' });
            } catch (e) { /* wasn't set */ }
            await github.rest.issues.addLabels({ ...common, issue_number: issue.number, labels: ['status: withdrawn'] });
            const author = (issue.user && issue.user.login) || '';
            const msg = "This nomination was closed before evaluation, so it's **withdrawn** and won't be scanned. Reopen it (or open a new nomination) if you'd like it re-queued.";
            await github.rest.issues.createComment({
              ...common, issue_number: issue.number, body: author ? `@${author} ${msg}` : msg });

  adopt-legacy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const common = { owner: context.repo.owner, repo: context.repo.repo };
            const QUEUED_MARKER = '<!-- nomination-adopted -->';
            const NOREPO_MARKER = '<!-- nomination-no-repo -->';
            const contributing =
              `https://github.com/${common.owner}/${common.repo}/blob/master/CONTRIBUTING.md`;
            // Conservative heuristic: an open issue whose title reads like
            // "add/nominate ... mcp/server" is treated as a legacy nomination.
            const looksLikeNomination = t => /\b(add|nominat)/i.test(t) && /\b(mcp|server)\b/i.test(t);
            const repoRe = /github\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+/i;

            const queuedExplain = (author) => {
              const msg = [
                "Thanks! I've tagged this as a **server nomination** and queued it. 👋",
                "",
                "**What that means:** this registry curates itself with AI — there's no manual PR",
                "step. On the next weekly scan, the AI reviews your nomination, posts the result here,",
                "and closes this issue. If it points to a public open-source GitHub repo that scores",
                "5+/10, it's added to the README automatically. Nothing else needed from you.",
                "",
                `_How it works: [CONTRIBUTING.md](${contributing})._`,
              ].join('\n');
              return author ? `${QUEUED_MARKER}\n@${author} ${msg}` : `${QUEUED_MARKER}\n${msg}`;
            };
            const noRepoExplain = (author) => {
              const msg = [
                "Thanks for the suggestion! 👋 This registry only lists **public, open-source MCP",
                "servers with a GitHub repository** — the AI reads the repo to score it, and I couldn't",
                "find a `https://github.com/owner/repo` link here, so there's nothing it can evaluate.",
                "",
                "If the server has a public repo, reopen this with the link added (or open a new",
                "nomination) and it'll be queued. If it's hosted or closed-source, it can't be listed.",
                "",
                `_How it works: [CONTRIBUTING.md](${contributing})._`,
              ].join('\n');
              return author ? `${NOREPO_MARKER}\n@${author} ${msg}` : `${NOREPO_MARKER}\n${msg}`;
            };

            const removeLabel = async (n, name) => {
              try { await github.rest.issues.removeLabel({ ...common, issue_number: n, name }); }
              catch (e) { /* wasn't set */ }
            };

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...common, state: 'open', per_page: 100 });
            let queued = 0, declined = 0;
            for (const issue of issues) {
              if (issue.pull_request) continue;  // skip PRs
              const labels = (issue.labels || []).map(l => (l.name || l));
              const labeledNomination = labels.includes('server-nomination');
              if (!labeledNomination && !looksLikeNomination(issue.title || '')) continue;

              const author = (issue.user && issue.user.login) || '';
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...common, issue_number: issue.number, per_page: 100 });
              const hasMarker = (mk) => comments.some(c =>
                c.user.type === 'Bot' && (c.body || '').includes(mk));

              if (repoRe.test(issue.body || '')) {
                // Real nomination — ensure labeled + queued; clear any stale 'declined'.
                const want = ['server-nomination', 'status: queued'].filter(l => !labels.includes(l));
                if (want.length) {
                  await github.rest.issues.addLabels({ ...common, issue_number: issue.number, labels: want });
                }
                if (labels.includes('status: declined')) await removeLabel(issue.number, 'status: declined');
                if (!hasMarker(QUEUED_MARKER)) {
                  await github.rest.issues.createComment({
                    ...common, issue_number: issue.number, body: queuedExplain(author) });
                }
                core.info(`Queued #${issue.number}: ${issue.title}`);
                queued++;
              } else if (labeledNomination) {
                // A confirmed nomination with no repo to evaluate — decline + close, don't queue.
                // Guarded to already-labeled issues so a stray title match isn't auto-closed.
                await removeLabel(issue.number, 'status: queued');
                if (!labels.includes('status: declined')) {
                  await github.rest.issues.addLabels({
                    ...common, issue_number: issue.number, labels: ['status: declined'] });
                }
                if (!hasMarker(NOREPO_MARKER)) {
                  await github.rest.issues.createComment({
                    ...common, issue_number: issue.number, body: noRepoExplain(author) });
                }
                await github.rest.issues.update({ ...common, issue_number: issue.number, state: 'closed' });
                core.info(`Declined (no repo) #${issue.number}: ${issue.title}`);
                declined++;
              }
              // else: title-only heuristic match with no repo — too weak to act on; leave it.
            }
            core.info(`Queued ${queued}, declined ${declined} (no repo)`);
