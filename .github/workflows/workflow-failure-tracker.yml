name: Workflow failure tracker

# Scheduled/automated workflows fail silently — a red run in the Actions tab is
# easy to miss for days (the lock + scanner jobs were both broken for ~3 weeks).
# This turns a failure into a visible, deduplicated tracking issue: one open
# issue per failing workflow. When that workflow next succeeds, its issue is
# closed automatically, so the issue's open/closed state mirrors CI health.

on:
  workflow_run:
    workflows:
      - "Auto Scanner"
      - "Lock closed threads"
      - "Reject content PRs"
      - "Validate nomination"
      - "Preview README"
    types: [completed]

permissions:
  issues: write

# One workflow can finish several times in quick succession; serialise per
# workflow so two events don't both open a duplicate issue.
concurrency:
  group: failure-tracker-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  track:
    # Only act on a decisive result. Skip cancelled / skipped / timed_out / neutral —
    # those aren't real failures and shouldn't churn the tracking issue.
    if: contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const common = { owner: context.repo.owner, repo: context.repo.repo };
            const label = 'workflow-failure';
            // Stable per-workflow key — survives workflow renames, unlike the title.
            const marker = `<!-- failure-tracker:workflow-${run.workflow_id} -->`;

            // Find the open tracking issue for THIS workflow, if any.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...common, state: 'open', labels: label, per_page: 100,
            });
            const issue = open.find(i => (i.body || '').includes(marker));

            const facts = [
              `- Workflow: **${run.name}**`,
              `- Run: ${run.html_url}`,
              `- Commit: \`${run.head_sha.slice(0, 7)}\` on \`${run.head_branch}\``,
              `- Trigger: \`${run.event}\` (attempt ${run.run_attempt})`,
            ].join('\n');

            if (run.conclusion === 'failure') {
              // Make sure the label exists with an intentional colour (idempotent).
              try {
                await github.rest.issues.createLabel({
                  ...common, name: label, color: 'd73a4a',
                  description: 'Auto-opened by the failure tracker when a CI workflow fails; auto-closed on recovery',
                });
              } catch (e) {
                if (e.status !== 422) core.warning(`label: ${e.message}`);
              }

              if (issue) {
                await github.rest.issues.createComment({
                  ...common, issue_number: issue.number,
                  body: `🔴 **Still failing.**\n\n${facts}`,
                });
                core.info(`Updated tracking issue #${issue.number} for "${run.name}".`);
              } else {
                const created = await github.rest.issues.create({
                  ...common,
                  title: `CI failing: ${run.name}`,
                  labels: [label],
                  body: [
                    marker,
                    '',
                    `🔴 The **${run.name}** workflow failed.`,
                    '',
                    facts,
                    '',
                    '<sub>Opened automatically when this workflow fails and closed automatically when it next succeeds.</sub>',
                  ].join('\n'),
                });
                core.info(`Opened tracking issue #${created.data.number} for "${run.name}".`);
              }
            } else {
              // Recovery: close the tracking issue (if one is open) for this workflow.
              if (issue) {
                await github.rest.issues.createComment({
                  ...common, issue_number: issue.number,
                  body: `🟢 **Recovered.** ${run.name} succeeded again.\n\n${facts}`,
                });
                await github.rest.issues.update({
                  ...common, issue_number: issue.number,
                  state: 'closed', state_reason: 'completed',
                });
                core.info(`Closed tracking issue #${issue.number} — "${run.name}" recovered.`);
              } else {
                core.info(`"${run.name}" succeeded; no open tracking issue to close.`);
              }
            }
