name: Reject content PRs

# The README and data/known_servers.json are MACHINE-GENERATED by the weekly
# Auto Scanner — a PR editing them is overwritten on the next run, so adding a
# server via PR can't work. Such PRs are auto-closed with an explanation that
# points to the nomination issue form. Genuine code PRs (and dependabot) are
# left untouched for the maintainer to review.
#
# Runs on new PRs (pull_request_target — has write access for fork PRs; SAFE
# because it never checks out or runs the PR's code, only reads changed paths)
# AND on a daily schedule / manual dispatch to sweep PRs that were already open
# before this workflow existed.

on:
  pull_request_target:
    types: [opened, reopened]
  schedule:
    - cron: '30 3 * * *'   # daily sweep of already-open PRs
  workflow_dispatch:

permissions:
  contents: write        # delete same-repo head branch
  pull-requests: write   # close the PR
  issues: write          # comment

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const common = { owner, repo };
            const nominateUrl =
              `https://github.com/${owner}/${repo}/issues/new?template=server-nomination.yml`;
            const body = [
              "Thanks for wanting to contribute! 🙏 Closing this automatically, and here's why:",
              "",
              "This is an **AI-curated** registry. `README.md`, `SCORES.md`, and the `data/` files are",
              "**machine-generated** by a weekly job that discovers and scores servers with AI —",
              "so any edit to them is overwritten on the next run, and a server can't be added by PR.",
              "",
              `👉 To suggest a server, **[open a nomination](${nominateUrl})** instead. The same AI`,
              "evaluates it on the next weekly scan; if it scores 50+/100 it appears automatically.",
              "",
              "_Code contributions (bug fixes, scanner/workflow improvements) are welcome — those",
              "PRs are not auto-closed. See `CONTRIBUTING.md`._",
            ].join('\n');

            async function triagePR(pr) {
              const login = (pr.user && pr.user.login) || '';
              const trustedBots = ['dependabot[bot]', 'github-actions[bot]'];
              if (trustedBots.includes(login) || pr.author_association === 'OWNER') {
                core.info(`#${pr.number}: skip (trusted author ${login})`);
                return;
              }
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...common, pull_number: pr.number, per_page: 100 });
              const generated = ['README.md', 'SCORES.md',
                                 'data/known_servers.json', 'data/star_history.jsonl'];
              const touchesGenerated = files
                .map(f => f.filename)
                .some(p => generated.includes(p) || p.startsWith('badges/'));
              if (!touchesGenerated) {
                core.info(`#${pr.number}: skip (code-only PR, left open)`);
                return;
              }

              const commentBody = login ? `@${login}\n\n${body}` : body;
              await github.rest.issues.createComment({ ...common, issue_number: pr.number, body: commentBody });
              await github.rest.pulls.update({ ...common, pull_number: pr.number, state: 'closed' });
              core.info(`#${pr.number}: commented + closed`);

              // Delete the head branch only if it lives in this repo (fork branches aren't ours).
              if (pr.head.repo && pr.head.repo.full_name === pr.base.repo.full_name) {
                try {
                  await github.rest.git.deleteRef({ ...common, ref: `heads/${pr.head.ref}` });
                  core.info(`#${pr.number}: deleted branch ${pr.head.ref}`);
                } catch (e) {
                  core.info(`#${pr.number}: could not delete branch: ${e.message}`);
                }
              }
            }

            const evt = context.payload.pull_request;
            if (evt) {
              // New-PR event
              await triagePR(evt);
            } else {
              // Scheduled / manual sweep of all currently-open PRs
              const prs = await github.paginate(github.rest.pulls.list, {
                ...common, state: 'open', per_page: 100 });
              core.info(`Sweeping ${prs.length} open PR(s)`);
              for (const pr of prs) {
                try { await triagePR(pr); }
                catch (e) { core.info(`#${pr.number}: error ${e.message}`); }
              }
            }
