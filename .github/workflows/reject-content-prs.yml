name: Reject content PRs

# The README and data/known_servers.json are MACHINE-GENERATED by the weekly
# Auto Scanner — a PR editing them is overwritten on the next run, so adding a
# server via PR can't work. Such PRs are auto-closed with an explanation that
# points to the nomination issue form. Genuine code PRs (and dependabot) are
# left untouched for the maintainer to review.
#
# Uses pull_request_target so it has write access for fork PRs. SAFE because it
# never checks out or runs the PR's code — it only reads the changed file paths.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: write        # delete same-repo head branch
  pull-requests: write   # close the PR
  issues: write          # comment

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const commonArgs = { owner: context.repo.owner, repo: context.repo.repo };

            // Never touch dependabot or the maintainer's own PRs.
            if (context.actor === 'dependabot[bot]' || pr.author_association === 'OWNER') {
              core.info('Skipping: trusted author.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...commonArgs, pull_number: pr.number, per_page: 100,
            });
            const paths = files.map(f => f.filename);
            const touchesGenerated = paths.some(
              p => p === 'README.md' || p === 'data/known_servers.json');

            if (!touchesGenerated) {
              core.info('Code-only PR — leaving open for review.');
              return;
            }

            const nominateUrl =
              `https://github.com/${commonArgs.owner}/${commonArgs.repo}` +
              `/issues/new?template=server-nomination.yml`;
            const body = [
              "Thanks for wanting to contribute! 🙏 Closing this automatically, and here's why:",
              "",
              "This is an **AI-curated** registry. `README.md` and `data/known_servers.json` are",
              "**machine-generated** by a weekly job that discovers and scores servers with AI —",
              "so any edit to them is overwritten on the next run, and a server can't be added by PR.",
              "",
              `👉 To suggest a server, **[open a nomination](${nominateUrl})** instead. The same AI`,
              "evaluates it on the next weekly scan; if it scores 5+/10 it appears automatically.",
              "",
              "_Code contributions (bug fixes, scanner/workflow improvements) are welcome — those",
              "PRs are not auto-closed. See `CONTRIBUTING.md`._",
            ].join('\n');

            await github.rest.issues.createComment({
              ...commonArgs, issue_number: pr.number, body });
            await github.rest.pulls.update({
              ...commonArgs, pull_number: pr.number, state: 'closed' });

            // Delete the head branch only if it lives in this repo (fork branches aren't ours).
            if (pr.head.repo && pr.head.repo.full_name === pr.base.repo.full_name) {
              try {
                await github.rest.git.deleteRef({
                  ...commonArgs, ref: `heads/${pr.head.ref}` });
                core.info(`Deleted branch ${pr.head.ref}`);
              } catch (e) {
                core.info(`Could not delete branch: ${e.message}`);
              }
            }
